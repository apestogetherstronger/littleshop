name: Weekly meal plan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/latest.md"
      - "output/**"
  schedule:
    # GitHub cron is UTC. This is Thursday 19:00 during Israel summer time
    # and 18:00 during winter time.
    - cron: "0 16 * * 4"

permissions:
  contents: read

concurrency:
  group: littleshop-weekly-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  plan:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly plan
        env:
          PYTHONPATH: src
        run: python -m littleshop.main

      - name: Summarize feed health
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/run-status.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## LittleShop feed health\n\n")
              if path.exists():
                  status = json.loads(path.read_text())
                  summary.write(f"Status: **{status['status']}**\n\n")
                  summary.write(f"Loaded chains: {', '.join(status['loaded_chains']) or 'none'}\n\n")
                  summary.write(f"Active promotion rows: {status['active_promotion_rows']}\n\n")
                  summary.write(f"Plan generated: {status['plan_published']}\n\n")
                  for error in status['errors']:
                      summary.write(f"- {error}\n")
              else:
                  summary.write("Planner did not produce feed diagnostics. See job logs.\n")
          PY

      - name: Upload feed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littleshop-feed-health
          path: output/run-status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: littleshop-weekly-plan
          path: |
            docs/latest.md
            output/plan.json
            output/deals.json
            output/products.json
          retention-days: 30

      - name: Commit latest generated plan
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Update weekly meal plan"
            git pull --rebase origin main
            git push origin main
          fi
