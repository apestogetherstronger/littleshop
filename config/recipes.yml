  - מחממים שמן במחבת רחבה ומשחימים את הטופו כ־6–8 דקות. מוציאים לצלחת.
  - מקפיצים את הפלפל והברוקולי, מוסיפים מעט מים ומכסים לכמה דקות עד לריכוך. מחזירים
