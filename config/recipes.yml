recipes:
- id: broccoli_ricotta_pasta
  name: Broccoli & ricotta pasta
  prep_minutes: 30
  tags:
  - vegetarian
  - dairy
  - kid-friendly
  ingredients:
  - ingredient: pasta
    quantity: 500
    unit: g
  - ingredient: broccoli
    quantity: 600
    unit: g
  - ingredient: ricotta
    quantity: 250
    unit: g
  - ingredient: parmesan
    quantity: 80
    unit: g
  instructions_he:
  - מבשלים את הפסטה במים מומלחים לפי הוראות האריזה. מוסיפים את הברוקולי לסיר בדקות
    האחרונות, עד שהוא רך. שומרים כוס ממי הבישול ומסננים.
  - מערבבים את הריקוטה עם מעט ממי הבישול, מלח ופלפל לקבלת רוטב.
  - מחזירים לסיר את הפסטה והברוקולי, מוסיפים את הרוטב והפרמזן ומערבבים על אש נמוכה.
    מוסיפים מי בישול לפי הצורך.
  pantry_note_he: שמן, מלח ותבלינים לפי הטעם; אינם כלולים באומדן הקניות. מים לפי הצורך.
- id: lentil_sweet_potato_curry
  name: Lentil & sweet-potato curry
  prep_minutes: 40
  tags:
  - vegetarian
  - vegan
  - one-pot
  ingredients:
  - ingredient: lentils
    quantity: 400
    unit: g
  - ingredient: sweet_potato
    quantity: 800
    unit: g
  - ingredient: coconut_milk
    quantity: 400
    unit: ml
  - ingredient: rice
    quantity: 400
    unit: g
  instructions_he:
  - שוטפים את העדשים וקולפים וחותכים את הבטטה לקוביות קטנות. מבשלים את האורז בנפרד
    לפי הוראות האריזה.
  - מחממים מעט שמן בסיר, מוסיפים תבלין קארי ומערבבים כחצי דקה. מוסיפים בטטה, עדשים
    וחלב קוקוס, ומים עד לכיסוי.
  - מביאים לרתיחה ומבשלים בעדינות כ־25–30 דקות, עד שהעדשים והבטטה רכות. מערבבים ומוסיפים
    מים לפי הצורך. עדשים ירוקות עשויות לדרוש זמן נוסף.
  - מתבלים במלח ומגישים על האורז.
  pantry_note_he: שמן, מלח ותבלינים לפי הטעם; אינם כלולים באומדן הקניות. מים לפי הצורך.
- id: cauliflower_chickpea_tray
  name: Roasted cauliflower & chickpea tray
  prep_minutes: 40
  tags:
  - vegetarian
  - vegan
  - oven
  ingredients:
  - ingredient: cauliflower
    quantity: 1
    unit: head
  - ingredient: chickpeas
    quantity: 500
    unit: g
  - ingredient: tahini
    quantity: 200
    unit: g
  instructions_he:
  - מחממים תנור ל־220 מעלות. מפרקים את הכרובית לפרחים; אם משתמשים בכרובית קפואה, מסירים
    קרח עודף. מסננים גרגרי חומוס מבושלים.
  - מערבבים כרובית וחומוס עם שמן, מלח ופפריקה. מפזרים בשכבה אחת בתבנית ואופים כ־25–35
    דקות, עד שהכרובית רכה וזהובה.
  - מדללים את הטחינה במים, מוסיפים מלח ומזלפים על הירקות לפני ההגשה.
  pantry_note_he: שמן, מלח ותבלינים לפי הטעם; אינם כלולים באומדן הקניות. מים לפי הצורך.
- id: shakshuka_feta
  name: Shakshuka with feta
  prep_minutes: 30
  tags:
  - vegetarian
  - dairy
  - kid-friendly
  ingredients:
  - ingredient: eggs
    quantity: 8
    unit: units
  - ingredient: tomatoes
    quantity: 1200
    unit: g
  - ingredient: tomato_sauce
    quantity: 500
    unit: g
  - ingredient: feta
    quantity: 200
    unit: g
  instructions_he:
  - קוצצים את העגבניות ומבשלים במחבת רחבה עם מעט שמן כ־5 דקות. מוסיפים רוטב עגבניות,
    מלח ופפריקה ומבשלים עוד כ־10 דקות.
  - יוצרים גומות ברוטב ושוברים לתוכן את הביצים. מכסים ומבשלים בעדינות עד שהביצים עשויות
    במידה הרצויה.
  - מפזרים פטה ומגישים.
  pantry_note_he: שמן, מלח ותבלינים לפי הטעם; אינם כלולים באומדן הקניות. מים לפי הצורך.
- id: tofu_stir_fry
  name: Tofu vegetable stir-fry
  prep_minutes: 30
