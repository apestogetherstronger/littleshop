recipes:
  - id: broccoli_ricotta_pasta
    name: "Broccoli & ricotta pasta"
    prep_minutes: 30
    tags: [vegetarian, dairy, kid-friendly]
    ingredients:
      - name: pasta
        quantity: 500
        unit: g
        search_terms: ["פסטה", "ספגטי", "פנה"]
        exclude_terms: ["רוטב"]
      - name: broccoli
        quantity: 600
        unit: g
        search_terms: ["ברוקולי"]
        exclude_terms: ["חטיפ", "קציצ", "שניצל", "לביבות", "מאפה", "פשטידה"]
      - name: ricotta
        quantity: 250
        unit: g
        search_terms: ["ריקוטה"]
        exclude_terms: ["רוטב", "רביולי", "פסטה", "בורקס", "מאפה"]
