    הוראות האריזה.
  - מכסים ואופים כ־35–40 דקות. מסירים כיסוי ואופים עוד כ־10 דקות, עד שהדפים רכים והגבינה
    מזהיבה. ממתינים 10 דקות לפני החיתוך.
  pantry_note_he: שמן, מלח ותבלינים לפי הטעם; אינם כלולים באומדן הקניות. מים לפי הצורך.
