- id: spinach_ricotta_lasagna
  name: Spinach & ricotta lasagna
  prep_minutes: 60
  tags:
  - vegetarian
  - dairy
  - oven
  ingredients:
  - ingredient: lasagna
    quantity: 500
    unit: g
  - ingredient: spinach
    quantity: 700
    unit: g
  - ingredient: ricotta
    quantity: 500
    unit: g
  - ingredient: mozzarella
    quantity: 300
    unit: g
  - ingredient: tomato_sauce
    quantity: 700
    unit: g
  instructions_he:
  - מחממים תנור ל־190 מעלות. מפשירים וסוחטים תרד קפוא, או מאדים תרד טרי וסוחטים. מערבבים
